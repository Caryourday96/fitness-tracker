# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - fitness-tracker-ca

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fitness-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm ci
          npm run build --if-present
          node --test --test-force-exit
          npm prune --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            server.js
            partner-sharing.js
            workout-days.js
            meal-guidance.js
            weekly-review.js
            training.js
            exercise-catalog.js
            exercise-catalog.json
            backups.js
            security.js
            progress.js
            push-reminders.js
            package.json
            package-lock.json
            public/
            node_modules/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_629B9674060845DFA969E48A9A7FEA2B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3D16408BAD844E3EAC333061F2AF7316 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E6B54F3410AF4BFCAFA72E4B8CACD8B0 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fitness-tracker-ca'
          slot-name: 'Production'
          package: .

