<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b35"><title>Steady — private fitness tracker</title><link rel="stylesheet" href="/static/app.css"></head><body><main id="app"><section class="card auth" id="auth"><p class="eyebrow">STEADY / PRIVATE TRACKING</p><h1>Build a healthier day, one check-in at a time.</h1><p class="muted">A calm fitness companion for repeatable workouts, recovery and useful history.</p><div class="tabs"><button class="tab active" data-auth="login">Sign in</button><button class="tab" data-auth="setup">Create account</button></div><form id="authForm"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="12" autocomplete="current-password" required><small>Use at least 12 characters.</small></label><button class="primary" type="submit">Continue</button><p class="error" id="authError"></p></form></section><section id="dashboard" hidden><header class="topbar"><div><p class="eyebrow">STEADY</p><h1>Today</h1></div><button class="ghost" id="logout">Sign out</button></header><div id="notice" class="notice" hidden></div><nav class="nav" aria-label="Sections"><button data-view="today" class="navbtn active">Today</button><button data-view="history" class="navbtn">History</button><button data-view="settings" class="navbtn">Settings</button></nav><section id="view-today" class="view"></section><section id="view-history" class="view" hidden></section><section id="view-settings" class="view" hidden></section></section></main><script type="module" src="/static/app.js"></script></body></html>
