me email for future sign-ins.</p></section><section id="dashboard" hidden><header class="topbar"><div><p class="eyebrow">STEADY</p><h1>Today</h1></div><button class="ghost" id="logout">Sign out</button></header><div id="notice" class="notice" hidden></div><nav class="nav" aria-label="Sections"><button data-view="today" class="navbtn active">Today</button><button data-view="history" class="navbtn">History</button><button data-view="settings" class="navbtn">Settings</button></nav><section id="view-today" class="view"></section><section id="view-history" class="view" hidden></section><section id="view-settings" class="view" hidden></section></section></main><script type="module" src="/static/app.js"></script></body></html>
